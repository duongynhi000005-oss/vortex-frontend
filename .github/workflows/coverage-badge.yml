name: Coverage Badge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-badge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  coverage-badge:
    name: Update coverage badge
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download coverage report
        uses: actions/download-artifact@fc02353415da80201a0da48ab47022efd7725d11 # v4.3.0
        with:
          name: coverage-report
          path: coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate coverage badge
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const fs = require('fs');
              const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const pct = summary.total.lines.pct;
              const color = pct >= 90 ? 'brightgreen' : pct >= 75 ? 'green' : pct >= 60 ? 'yellow' : 'red';
              const badge = { schemaVersion: 1, label: 'coverage', message: pct + '%', color };
              fs.mkdirSync('badges', { recursive: true });
              fs.writeFileSync('badges/coverage.json', JSON.stringify(badge, null, 2) + '\n');
            "
          else
            echo "::warning::No coverage summary found; skipping badge update."
          fi

      - name: Commit coverage badge
        if: ${{ hashFiles('badges/coverage.json') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.json
          if git diff --staged --quiet; then
            echo "Coverage badge unchanged."
          else
            git commit -m "chore: update coverage badge [skip ci]"
            git push
          fi
