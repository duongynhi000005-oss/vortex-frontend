name: Update visual snapshots

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  update:
    if: github.event.label.name == 'update-snapshots' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:storybook
      - run: npm run update:visual
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .storybook/playwright/__screenshots__
          git diff --cached --quiet || git commit -m "test: update visual baselines"
          git push
