name: Link Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly on Monday at 09:00 UTC for external links
    - cron: '0 9 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-links:
    name: Check Internal Markdown Links
    runs-on: ubuntu-latest
    # Internal link checks run on PRs and scheduled checks
    if: |
      github.event_name != 'schedule' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check internal markdown links (relative paths only)
        uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31 # v1.0.17
        with:
          use-quiet-mode: true
          use-verbose-mode: false
          config-file: '.github/workflows/mlc-config.json'
          base-branch: main

  external-links:
    name: Check External Markdown Links
    runs-on: ubuntu-latest
    # Run external link checks on schedule only to avoid flakiness blocking PRs
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check external markdown links with retries
        uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31 # v1.0.17
        with:
          use-quiet-mode: false
          use-verbose-mode: false
          config-file: '.github/workflows/mlc-config-external.json'
          base-branch: main
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Scheduled Check] Weekly Link Check Found Broken External Links',
              body: `A weekly link check found broken external links in the documentation. Please investigate and fix the broken links.\n\nWorkflow run: ${context.server_url}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['documentation', 'bug']
            })
